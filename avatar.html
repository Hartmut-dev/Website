<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>LinkedIn Avatar Generator</title>
    <style>
        body {
            background-color: #0d1117; 
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-box {
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal-text {
            color: #58a6ff; 
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 4.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            background-color: #58a6ff;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="avatar-box">
        <div class="terminal-text">&gt;hk.dev<span class="cursor"></span></div>
    </div>

</body>
</html>
