# Secret scan on every push and pull request, including edits made on github.com
# (those skip the local pre-commit hook). Detection only: by the time this runs the
# commit is already public, so a failure means "rotate the secret / rewrite history now".
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0              # full history: the whole repo is small
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (same version as the local hook, checksum-pinned)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks

      # Private rules (patterns for private homelab details) are not in this public repo.
      # They come from the repo secret GITLEAKS_CONFIG_TOML; without it, built-in rules only.
      - name: Scan
        env:
          PRIVATE_RULES: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: |
          cfg=""
          if [ -n "$PRIVATE_RULES" ]; then
            printf '%s\n' "$PRIVATE_RULES" > "$RUNNER_TEMP/rules.toml"
            cfg="--config $RUNNER_TEMP/rules.toml"
          else
            echo "::warning::GITLEAKS_CONFIG_TOML secret not set: scanning with built-in rules only"
          fi
          ./gitleaks git --redact --no-banner $cfg .
